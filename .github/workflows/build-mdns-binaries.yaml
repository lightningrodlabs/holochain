# Builds release `holochain` and `hc` binaries for the five platforms Moss
# ships for, from this branch (Holochain 0.7.1 + the kitsune2 hello/PoK
# access module + mDNS LAN discovery), and publishes them to a prerelease on
# this fork.
#
# FIELD-TEST-ONLY. Not a Holochain release. See the note at the top of the
# workspace Cargo.toml.
#
# Asset naming deliberately MIRRORS stock holochain releases:
#
#   holochain-<target-triple>[.exe]
#   hc-<target-triple>[.exe]
#
# so the Moss-side change (scripts/fetch-fns.mjs + holochain-checksums.json)
# is only the repo owner and the version/tag, not the filename shape.
#
# Portability envelope, matched to stock holochain so the binaries run on
# the same machines Moss already supports:
#   - linux:  cargo-zigbuild against glibc 2.34 (`<triple>.2.34`). A plain
#             runner build would silently inherit the runner's glibc
#             (2.35 on ubuntu-22.04) and refuse to start on older distros.
#             zigbuild also gives us the aarch64 cross-compile for free.
#   - macOS:  MACOSX_DEPLOYMENT_TARGET=11.0, set explicitly for the same
#             inherited-minimum failure class.
#   - windows: msvc, no special handling beyond the vendored-OpenSSL
#             toolchain below.
#
# Windows note: holochain pulls libsqlite3-sys with
# `bundled-sqlcipher-vendored-openssl`, so OpenSSL is compiled from source.
# That needs NASM and a real Perl -- Git-for-Windows' perl is not enough and
# fails with "'perl' reported failure with exit code: 2". We point
# OPENSSL_SRC_PERL at the Strawberry Perl preinstalled on the runner image.
#
# Trigger: workflow_dispatch, plus push on this branch. `workflow_dispatch`
# is only dispatchable once the workflow file exists on the repository's
# default branch, which this one does not; the push trigger is the reliable
# path for a topic-branch build. Both are wired up so either works.
name: build-mdns-binaries

on:
  workflow_dispatch:
  push:
    branches: [moss-0.16, moss-0.16-0.7.1]

env:
  # Tag policy, enforced by the release job below:
  #   - the tag is created for the commit that first publishes it;
  #   - a later run for that SAME commit re-uploads its assets, so a failed
  #     matrix leg can be retried without minting a new tag;
  #   - a run for a DIFFERENT commit against an existing tag FAILS, and says
  #     to bump RELEASE_TAG.
  # The last rule is what makes the tag mean something: published Moss builds
  # pin the sha256 of the assets under the tag they were cut against, so a tag
  # that moved to another commit would silently invalidate that provenance.
  # Bump this whenever the source below changes, kitsune2 rev included.
  RELEASE_TAG: holochain-0.7.1-mdns.8
  KITSUNE2_REF: moss-0.16
  KITSUNE2_REV: 1703ac68aebaf14b173a86dbed4cbaca0d33b736
  CARGO_TERM_COLOR: always

concurrency:
  group: build-mdns-binaries
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            zig: true
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            zig: true
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 300
    steps:
      - name: Free disk space (linux runners are tight for holochain release builds)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: Rust toolchain (pinned by rust-toolchain.toml) + target
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      # Versions pinned to the pair used for the hand-built linux x86_64
      # binaries, so CI reproduces that toolchain rather than drifting.
      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        shell: bash
        run: |
          set -euo pipefail
          pip3 install --user ziglang==0.13.0
          python3 -m ziglang version
          # cargo-zigbuild shells out to a `zig` on PATH; the pip package
          # only exposes `python3 -m ziglang`, so give it a shim.
          printf '#!/usr/bin/env bash\nexec python3 -m ziglang "$@"\n' \
            > "$HOME/.cargo/bin/zig"
          chmod +x "$HOME/.cargo/bin/zig"
          zig version
          curl -sSfL -o /tmp/czb.tar.xz \
            https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.0/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/czb.tar.xz --strip-components=1 \
            -C "$HOME/.cargo/bin" \
            cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild
          chmod +x "$HOME/.cargo/bin/cargo-zigbuild"
          cargo-zigbuild --version

      - name: Install NASM (vendored OpenSSL)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Point vendored OpenSSL at Strawberry Perl
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          C:/Strawberry/perl/bin/perl.exe --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Build holochain + hc (release)
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          if [ "${{ matrix.zig }}" = "true" ]; then
            # `.2.34` pins the glibc the binary is linked against, rather
            # than inheriting the runner's.
            BUILD=(cargo zigbuild --target "${{ matrix.target }}.2.34")
          else
            BUILD=(cargo build --target "${{ matrix.target }}")
          fi
          "${BUILD[@]}" --release --locked -p holochain --bin holochain
          "${BUILD[@]}" --release --locked -p holochain_cli --bin hc

      - name: Smoke check (native targets only)
        # aarch64-linux is cross-compiled on an x86_64 runner, so it cannot
        # be executed here; it is exercised on the target machine instead.
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          "target/${{ matrix.target }}/release/holochain${EXT}" --version
          "target/${{ matrix.target }}/release/hc${EXT}" --version

      - name: Report glibc ceiling (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # readelf is architecture-agnostic; objdump on this runner is not,
          # and would refuse the cross-compiled aarch64 binary.
          for b in holochain hc; do
            echo "== $b =="
            readelf -W --dyn-syms "target/${{ matrix.target }}/release/$b" \
              | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5
          done

      - name: Stage assets under stock-holochain names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          for b in holochain hc; do
            cp "target/${{ matrix.target }}/release/${b}${EXT}" \
               "staged/${b}-${{ matrix.target }}${EXT}"
          done
          ls -l staged

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.target }}
          path: staged/*
          if-no-files-found: error

  release:
    name: publish ${{ github.workflow }} assets
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bins-*
          merge-multiple: true

      - name: Verify the kitsune2 rev this build actually used
        shell: bash
        run: |
          set -euo pipefail
          # The release notes name KITSUNE2_REV as the source of these
          # binaries. That is only true if the lockfile the matrix built
          # `--locked` against resolves to it.
          LOCK_REVS=$(grep -o 'lightningrodlabs/kitsune2?rev=[0-9a-f]*' Cargo.lock \
            | sed 's/.*rev=//' | sort -u)
          if [ "$LOCK_REVS" != "$KITSUNE2_REV" ]; then
            echo "Cargo.lock resolves the kitsune2 fork to:"
            echo "$LOCK_REVS"
            echo "but KITSUNE2_REV is $KITSUNE2_REV."
            exit 1
          fi
          # And only if no crate manifest pins a different rev. Counting the
          # lines that merely name the fork against the lines that name it
          # with the expected rev also catches a manifest that split `git`
          # and `rev` across lines, which the pattern above would miss.
          NAMED=$(grep -h 'lightningrodlabs/kitsune2' crates/*/Cargo.toml | wc -l)
          PINNED=$(grep -h "lightningrodlabs/kitsune2\", rev = \"$KITSUNE2_REV\"" \
            crates/*/Cargo.toml | wc -l)
          if [ "$NAMED" != "$PINNED" ]; then
            echo "$NAMED manifest lines name the kitsune2 fork, $PINNED pin $KITSUNE2_REV:"
            grep -Hn 'lightningrodlabs/kitsune2' crates/*/Cargo.toml \
              | grep -v "rev = \"$KITSUNE2_REV\"" || true
            exit 1
          fi
          echo "kitsune2 $KITSUNE2_REV: Cargo.lock and $PINNED manifest pins agree"

      - name: Compute sha256 checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum holochain-* hc-* | sort -k2 > checksums-sha256.txt
          cat checksums-sha256.txt
          # Ten binaries: holochain + hc across five targets.
          test "$(grep -c . checksums-sha256.txt)" -eq 10

      - name: Enforce the tag policy, then create the prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # `--target ${{ github.sha }}` below is what puts a commit sha in
          # targetCommitish, so an existing release can be compared against
          # the commit this run is building.
          if EXISTING=$(gh release view "$RELEASE_TAG" \
              --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            if [ "$EXISTING" = "${{ github.sha }}" ]; then
              echo "$RELEASE_TAG was published from this commit; re-uploading its assets."
              exit 0
            fi
            echo "$RELEASE_TAG was published from $EXISTING, this run is ${{ github.sha }}."
            echo "A tag stays with the commit that first published it, so that the"
            echo "checksums Moss pins against it keep meaning what they meant."
            echo "Bump RELEASE_TAG in this workflow and re-run."
            exit 1
          fi
          # printf rather than a heredoc: heredoc bodies have to sit at
          # column 0, which would terminate this YAML block scalar.
          printf '%s\n' \
            'Field-test build of Holochain 0.7.1 with the kitsune2 hello/proof-of-knowledge' \
            'access module **plus mDNS LAN discovery**. **Not a Holochain release and not' \
            'for general use** -- it network-partitions from stock Holochain 0.7 by design.' \
            '' \
            'What mDNS adds: peers on the same LAN find and dial each other with the' \
            'bootstrap server AND the relay unreachable. Each conductor announces a' \
            'per-space mDNS record, resolves its neighbours through the iroh endpoint' \
            'mDNS address lookup, and dials the resulting direct addresses without any' \
            'server in the path. The record carries a fingerprint derived from the space' \
            'id, never the space id itself, so a LAN listener learns that some space is' \
            'present but not which one.' \
            '' \
            'Additive on top of `holochain-0.7.0-hello.2`: the hello/PoK access module' \
            'and `HCP2P_PROTO_VER=1002` are unchanged, so hello.2 and every mdns.* node' \
            'are on the same cohort and interoperate.' \
            '' \
            'mDNS itself is inert unless enabled, but the kitsune2 rev underneath is not' \
            'only mDNS: it also changes how every node handles unresponsive marks. A' \
            'peer connecting clears its mark, and a failed dial no longer marks a peer' \
            'that already has a live connection. Both make a node retry peers it would' \
            'previously have written off, and both are observable in the peer-meta rows' \
            'even with mDNS off.' \
            '' \
            'What mdns.1 fixes over mdns.0: LAN discovery now rebinds when the local' \
            'address set changes. In mdns.0 the mDNS lookup was created once at' \
            'startup, so a node booted with its network interface down never became' \
            'LAN-dialable -- it stayed invisible to its neighbours even after the link' \
            'came up. The lookup is now re-created on a local address change, so such a' \
            'node joins the LAN as soon as it has an address. Found in a two-machine' \
            'field test.' \
            '' \
            'What mdns.2 fixes over mdns.1: the relay-known-down LAN dial bypass now' \
            'accepts IPv6 global-unicast addresses that share a /64 with one of the' \
            'node'"'"'s own. Before, that bypass dialled only RFC 1918, IPv4 link-local and' \
            'IPv6 ULA addresses, so on a LAN numbered by SLAAC with global IPv6 every' \
            'resolved neighbour was rejected and a node whose relay had died could not' \
            'originate LAN dials until the relay returned or it restarted. IPv4' \
            'handling, the relay-up path, IPv6 link-local and carrier-grade NAT space' \
            'are unchanged.' \
            '' \
            'What mdns.3 changes over mdns.2: kitsune2 is rebased onto current upstream' \
            'main (branch `moss-0.16`) instead of v0.6.0-dev.0. That brings upstream'"'"'s' \
            'simultaneous-open send preservation (the release-0.5 fix, identical to' \
            'v0.5.2 in the iroh transport), the per-space relay and bootstrap override' \
            'fixes, known-peer endpoint ordering by advertisement timestamp, and' \
            'gossip-message attribution. The fork'"'"'s own QAD relay re-insert commit is' \
            'replaced by the identical upstream one. Upstream'"'"'s reverted PR #641 (transport' \
            'creation failing when no relay URL arrives, fatal offline) is not in this' \
            'base. The hello/PoK and mDNS behaviour is unchanged. The earlier' \
            '`holochain-0.7.0-mdns.*` tags and their assets are left untouched.' \
            '' \
            'What mdns.4 changes over mdns.3: the Holochain base moves from 0.7.0 to' \
            '0.7.1-rc.2 (DHT indexes, publish and validation-receipt fixes, source-chain' \
            'restore, direct signals), and it carries the capability grant wire fix from' \
            'https://github.com/holochain/holochain/pull/6042, so DNAs built against' \
            'hdk 0.7.0 and against hdk 0.7.1 both run and chains written by 0.7.0 open.' \
            'Without that fix stock 0.7.1-rc.2 rejects every hdk 0.7.0 zome that commits' \
            'a grant in `init`. The kitsune2 rev, the hello/PoK module and' \
            '`HCP2P_PROTO_VER=1002` are unchanged, so mdns.3 and mdns.4 nodes stay on' \
            'one cohort; only direct signals, which Moss does not use, differ between' \
            'the two Holochain bases.' \
            '' \
            'What mdns.5 changes over mdns.4: the Holochain base moves from 0.7.1-rc.2 to' \
            'the 0.7.1 release (release preparation only, no code change between the' \
            'two), still carrying the capability grant wire fix, which upstream has' \
            'not merged yet.' \
            '' \
            'What mdns.6 changes over mdns.5: the kitsune2 rev moves its iroh' \
            'dependencies from the 1.1 line to iroh 1.4.1 (iroh, iroh-relay,' \
            'iroh-base, iroh-dns) and the LAN lookup to iroh-mdns-address-lookup' \
            '0.6.1. That is the same iroh line the Moss relay server is built on, so' \
            'conductor and relay run one QUIC stack (noq 1.4). No kitsune2 or' \
            'Holochain source changes; the hello/PoK module, mDNS behaviour and' \
            '`HCP2P_PROTO_VER=1002` are unchanged, so mdns.5 and mdns.6 nodes stay on' \
            'one cohort.' \
            '' \
            'What mdns.7 fixes over mdns.6: a Holochain 0.7 performance regression where' \
            'every zome call, reads included, loaded and deserialized the agent'"'"'s whole' \
            'source chain to check whether zome init had run, adding time proportional' \
            'to chain length to each call (tens of milliseconds per call once a chain' \
            'reaches a few thousand actions). The init check is now cached per cell and' \
            'source chain queries, including the `query` host function, apply their' \
            'action-type and sequence-range filters in SQL. No wire or network change;' \
            'the kitsune2 rev, the hello/PoK module, mDNS behaviour and' \
            '`HCP2P_PROTO_VER=1002` are unchanged, so mdns.6 and mdns.7 nodes stay on' \
            'one cohort.' \
            '' \
            'What mdns.8 fixes over mdns.7: the kitsune2 rev picks up upstream' \
            'holochain/kitsune2@d07dbe3 (issue 658). Sends to one peer queue on a' \
            'per-peer lock; when the first dial failed and marked the peer' \
            'unresponsive, every queued send still ran its own full connect timeout,' \
            'so one unreachable peer cost one timeout per space. A queued send or dial' \
            'now sees the mark once it holds the lock and fails fast instead of' \
            'dialing again; a mark older than the attempt is ignored so a recovered' \
            'peer is dialed. No wire change; the hello/PoK module, mDNS behaviour and' \
            '`HCP2P_PROTO_VER=1002` are unchanged, so mdns.7 and mdns.8 nodes stay on' \
            'one cohort.' \
            '' \
            'Sources:' \
            '' \
            "- holochain: https://github.com/lightningrodlabs/holochain/tree/${GITHUB_REF_NAME} (\`${GITHUB_SHA}\`)" \
            "- kitsune2: https://github.com/lightningrodlabs/kitsune2/tree/${KITSUNE2_REF} (\`${KITSUNE2_REV}\`)" \
            '' \
            'Assets use the same names as stock holochain releases' \
            '(`holochain-<triple>`, `hc-<triple>`, `.exe` on Windows), so Moss only needs' \
            'to repoint the repo and the version. Linux binaries target glibc 2.34;' \
            'macOS binaries target 11.0.' \
            '' \
            'The `holochain-0.7.0-hello.*` tags are left untouched for provenance.' \
            > notes.md
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Holochain 0.7.1 + kitsune2 hello/PoK + mDNS LAN discovery (field test, ${RELEASE_TAG#holochain-0.7.1-})" \
            --notes-file notes.md

      - name: Upload assets (clobber makes re-runs of this tag idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            dist/holochain-* dist/hc-* dist/checksums-sha256.txt --clobber
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'
