[package]
name = "hcterm"
version = "0.7.0"
description = "A terminal for Holochain"
license = "Apache-2.0"
repository = "https://github.com/holochain/holochain"
documentation = "https://docs.rs/holochain_terminal"
authors = ["Holochain Core Dev Team <devcore@holochain.org>"]
edition = "2021"
default-run = "hcterm"

[[bin]]
name = "hcterm"
path = "src/main.rs"

# reminder - do not use workspace deps
[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.29"
clap = { version = "4", features = ["derive"] }
url = "2"
once_cell = "1"
chrono = "0.4"
holo_hash = { version = "^0.7.0", path = "../holo_hash", features = [
  "encoding",
  "kitsune2",
] }
holochain_client = { version = "^0.9.0", path = "../client", default-features = false }
holochain_util = { version = "^0.7.0", path = "../holochain_util" }
holochain_conductor_api = { version = "^0.7.0", path = "../holochain_conductor_api", default-features = false }
holochain_types = { version = "^0.7.0", path = "../holochain_types" }
tokio = { version = "1.36.0", features = ["full"] }
# FIELD-TEST-ONLY dependency redirection: see the note in the workspace Cargo.toml.
kitsune2_api = { git = "https://github.com/lightningrodlabs/kitsune2", rev = "09d3365446cad7b4a4d44de6c50bdcbddf1bb06b" }
kitsune2_core = { git = "https://github.com/lightningrodlabs/kitsune2", rev = "09d3365446cad7b4a4d44de6c50bdcbddf1bb06b" }
kitsune2_bootstrap_client = { git = "https://github.com/lightningrodlabs/kitsune2", rev = "09d3365446cad7b4a4d44de6c50bdcbddf1bb06b" }

[lints]
workspace = true
